<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог Расчетов</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Переключатель темы -->
<div class="theme-switch-wrapper" style="position: absolute; top: 20px; right: 20px; z-index: 2000; display: flex; align-items: center; gap: 8px;">
  <span style="font-size: 14px; font-family: sans-serif;" class="theme-text">🌙</span>
  <label class="theme-switch" style="display: inline-block; height: 24px; position: relative; width: 44px;">
    <input type="checkbox" id="theme-checkbox" style="display:none;">
    <div class="slider" style="background-color: #ccc; bottom: 0; cursor: pointer; left: 0; position: absolute; right: 0; top: 0; transition: .4s; border-radius: 34px;"></div>
  </label>
</div>

    <header>
        <h1>Каталог Онлайн Расчетов</h1>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Поиск по названию или описанию...">
        </div>
        <div id="tags-container" class="tags-filter">
            <!-- Теги добавятся автоматически через JS -->
        </div>
    </header>

    <main>
        <div id="cards-grid" class="cards-grid">
            <!-- Карточки добавятся автоматически через JS -->
        </div>
        <div id="no-results" class="no-results hidden">Ничего не найдено</div>
    </main>

    <script src="app.js"></script>
</body>
</html>
