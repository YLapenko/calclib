<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог Онлайн Расчетов</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Переключатель темы (Стили перенесены в CSS, добавлен класс theme-switch) -->
    <div class="theme-switch-wrapper">
        <span class="theme-text" role="img" aria-label="Темная тема">🌙</span>
        <label class="theme-switch">
            <input type="checkbox" id="theme-checkbox">
            <div class="slider"></div>
        </label>
    </div>

    <header>
        <h1>Каталог Онлайн Расчетов</h1>
        <div class="search-container">
            <!-- Тип search для удобства очистки поля на смартфонах -->
            <input type="search" id="search-input" placeholder="Поиск по названию или описанию...">
        </div>

        <!-- Кнопка сброса всех фильтров -->
        <button id="reset-filters-btn" class="reset-btn hidden">✕ Сбросить все фильтры</button>
        
        <div id="tags-container" class="tags-filter">
            <!-- Теги добавятся автоматически через JS -->
        </div>
    </header>

    <main>
        <div id="cards-grid" class="cards-grid">
            <!-- Карточки добавятся автоматически через JS -->
        </div>
        <div id="no-results" class="no-results hidden">Ничего не найдено</div>
    </main>

    <script src="app.js"></script>
</body>
</html>
