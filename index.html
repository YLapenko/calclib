<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог Онлайн Калькуляторов</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Переключатель темы (Стили перенесены в CSS, добавлен класс theme-switch) -->
    <div class="theme-switch-wrapper">
        <span class="theme-text" role="img" aria-label="Темная тема">🌙</span>
        <label class="theme-switch">
            <input type="checkbox" id="theme-checkbox">
            <div class="slider"></div>
        </label>
    </div>

    <header>
        <h1>Каталог Онлайн Калькуляторов</h1>
        <div class="search-container">
            <!-- Тип search для удобства очистки поля на смартфонах -->
            <input type="search" id="search-input" placeholder="Поиск по названию или описанию...">
        </div>

        <!-- Кнопка сброса всех фильтров -->
        <button id="reset-filters-btn" class="reset-btn hidden">✕ Сбросить все фильтры</button>
        
        <div id="tags-container" class="tags-filter">
            <!-- Теги добавятся автоматически через JS -->
        </div>
    </header>

    <main>
        <div id="cards-grid" class="cards-grid">
            <!-- Карточки добавятся автоматически через JS -->
        </div>
        <div id="no-results" class="no-results hidden">Ничего не найдено</div>
    </main>

    <footer>
    <div class="footer-container">
        <div class="footer-section">
            <h4>Каталог Расчетов</h4>
            <p>Каталог онлайн-калькуляторов и инструментов для инженерных расчётов.</p>
        </div>
        <div class="footer-section">
            <h4>Ссылки</h4>
            <ul>
                <li><a href="#">Главная</a></li>
                <li><a href="https://github.com/YLapenko/calclib" target="_blank">Проект на GitHub</a></li>
            </ul>
        </div>
        <div class="footer-section">
            <h4>Контакты</h4>
            <p>Email: <a href="mailto:y-u-ry@yandex.ru">y-u-ry@yandex.ru</a></p>
        </div>
    </div>
    <div class="footer-bottom">
        <p>&copy; 2026 Каталог Онлайн Расчетов. Все права защищены.</p>
    </div>
    </footer>


    <script src="app.js"></script>
</body>
</html>
